<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Scroll Film</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="film" id="film">
    <video id="filmVideo" class="film__video" muted playsinline preload="auto" aria-hidden="true">
      <source media="(max-width: 767px)" src="zombies.1920x1080.mp4" type="video/mp4">
      <source src="zombies.3840x2160.mp4" type="video/mp4">
    </video>
    <div class="film__shade" aria-hidden="true"></div>
    <div class="film__intro" id="intro">
      <span class="eyebrow">SCROLL TO EXPERIENCE</span>
      <span class="scroll-mark" aria-hidden="true"><i></i></span>
    </div>
    <div class="film__progress" aria-hidden="true"><span id="progressBar"></span></div>
  </main>
  <div class="scroll-track" id="scrollTrack" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
